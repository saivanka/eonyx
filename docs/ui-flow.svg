<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E6862"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#F6F4F1"/>

  <!-- Row labels -->
  <text x="45" y="34" font-size="12" fill="#A59E96" letter-spacing="1">BROWSE</text>
  <text x="45" y="174" font-size="12" fill="#A59E96" letter-spacing="1">TABS AND ACCOUNT</text>
  <text x="10" y="334" font-size="12" fill="#A59E96" letter-spacing="1">CHECKOUT AND ORDERS</text>

  <!-- Row A: browse -->
  <g font-size="14" fill="#121212" text-anchor="middle">
    <rect x="45" y="44" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="120" y="77">Welcome</text>
    <rect x="235" y="44" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="310" y="77">Discover</text>
    <rect x="425" y="44" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="77">Category</text>
    <rect x="615" y="44" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="690" y="77">Product</text>
    <rect x="805" y="44" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="880" y="77">Bag</text>
  </g>

  <!-- Row B: tabs and account -->
  <g font-size="14" fill="#121212" text-anchor="middle">
    <rect x="45" y="184" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="120" y="217">Search</text>
    <rect x="235" y="184" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="310" y="217">Saved</text>
    <rect x="425" y="184" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="217">Profile</text>
    <rect x="615" y="184" width="150" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="690" y="217">Sign in</text>
  </g>

  <!-- Row C: checkout and orders -->
  <g font-size="14" fill="#121212" text-anchor="middle">
    <rect x="10" y="344" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#A8844A" stroke-width="1.6"/>
    <text x="80" y="370">1 Address</text>
    <text x="80" y="388" font-size="11" fill="#6E6862">guest email</text>
    <rect x="178" y="344" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#A8844A" stroke-width="1.6"/>
    <text x="248" y="370">2 Delivery</text>
    <text x="248" y="388" font-size="11" fill="#6E6862">courier or pickup</text>
    <rect x="346" y="344" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#A8844A" stroke-width="1.6"/>
    <text x="416" y="370">3 Payment</text>
    <text x="416" y="388" font-size="11" fill="#6E6862">cash on delivery</text>
    <rect x="514" y="344" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#A8844A" stroke-width="1.6"/>
    <text x="584" y="370">4 Review</text>
    <text x="584" y="388" font-size="11" fill="#6E6862">one total</text>
    <rect x="682" y="344" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#A8844A" stroke-width="1.6"/>
    <text x="752" y="370">Success</text>
    <text x="752" y="388" font-size="11" fill="#6E6862">order number</text>
    <rect x="850" y="344" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#121212" stroke-width="1.2"/>
    <text x="920" y="370">Order tracking</text>
    <text x="920" y="388" font-size="11" fill="#6E6862">live timeline</text>
  </g>

  <!-- Arrows: browse row -->
  <g stroke="#6E6862" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="195" y1="72" x2="233" y2="72"/>
    <line x1="385" y1="72" x2="423" y2="72"/>
    <line x1="575" y1="72" x2="613" y2="72"/>
    <line x1="765" y1="72" x2="803" y2="72"/>
    <!-- Discover to Saved (tab bar) -->
    <line x1="310" y1="100" x2="310" y2="182"/>
    <!-- Profile to sign in -->
    <line x1="575" y1="212" x2="613" y2="212"/>
    <!-- Bag to address (elbow route) -->
    <path d="M880,100 V292 H80 V342"/>
    <!-- Checkout row -->
    <line x1="150" y1="372" x2="176" y2="372"/>
    <line x1="318" y1="372" x2="344" y2="372"/>
    <line x1="486" y1="372" x2="512" y2="372"/>
    <line x1="654" y1="372" x2="680" y2="372"/>
    <line x1="822" y1="372" x2="848" y2="372"/>
  </g>
  <text x="500" y="454" font-size="12" fill="#6E6862" text-anchor="middle">Every tab sits in the tab bar: Discover, Search, Bag, Saved, Profile. Gold boxes are the four checkout steps.</text>
</svg>
